<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Şehir seçerek hava durumu bilgisini görüntüleyen örnek uygulama.">
  <title>Hava Durumu</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="css">
    <div class="container">
      <div class="inpu">
        <h1>Hava Durumu</h1>
        <label for="girdi">Şehir</label>
        <input id="girdi" type="search" placeholder="Şehir girin" autocomplete="off">
        <p class="status" role="status" aria-live="polite"></p>
      </div>
      <section class="output" aria-live="polite">
        <h2 class="sehir"></h2>
        <p class="derece"></p>
        <div class="dur">
          <p class="durum"></p>
          <div class="img"></div>
        </div>
        <time class="time"></time>
      </section>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
